[package]
name = "velocity"
version = "0.4.4"
description = "A fast, friendly cross-platform download manager"
authors = ["Muhammad Qasim"]
license = "MIT"
repository = "https://github.com/mr-kasim-mehar/velocity-download-manager"
edition = "2021"

[lib]
name = "velocity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
dirs = "6"
regex = "1"
