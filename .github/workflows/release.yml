name: Build, sign, and publish Windows installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Resolve official FFmpeg asset digest
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh api repos/yt-dlp/FFmpeg-Builds/releases/tags/latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the official FFmpeg release metadata.' }
          $release = $releaseJson | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-gpl.zip' } | Select-Object -First 1
          if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw 'The official FFmpeg asset has no valid SHA-256 digest.' }
          $sha256 = $asset.digest.Substring(7).ToUpperInvariant()
          "VELOCITY_FFMPEG_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download and verify bundled tools
        shell: powershell
        run: ./scripts/prepare-windows-tools.ps1
      - name: Package browser extension
        shell: powershell
        run: ./scripts/package-extension.ps1
      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis,msi
      - name: Stage unsigned installers
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release/windows-unsigned | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            Copy-Item -Destination release/windows-unsigned
          if (-not (Get-ChildItem release/windows-unsigned -File)) { throw 'No Windows installers were produced.' }
      - name: Upload unsigned artifact for SignPath
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: velocity-windows-unsigned
          path: release/windows-unsigned/*
          if-no-files-found: error
          retention-days: 7
      - name: Detect SignPath configuration
        id: signing
        shell: powershell
        run: |
          $configured = [bool]($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID -and $env:SIGNPATH_PROJECT_SLUG -and $env:SIGNPATH_SIGNING_POLICY_SLUG)
          "configured=$($configured.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Submit installers to SignPath
        if: steps.signing.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/windows-signed
      - name: Prepare publishable Windows artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release/windows | Out-Null
          if ('${{ steps.signing.outputs.configured }}' -eq 'true' -and '${{ startsWith(github.ref, 'refs/tags/') }}' -eq 'true') {
            Get-ChildItem release/windows-signed -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' } |
              Copy-Item -Destination release/windows
          } else {
            Get-ChildItem release/windows-unsigned -File | ForEach-Object {
              $target = Join-Path 'release/windows' ($_.BaseName + '-unsigned' + $_.Extension)
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          }
          if (-not (Get-ChildItem release/windows -File)) { throw 'No publishable Windows installers were found.' }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Get-ChildItem release/windows -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object {
              npm run tauri signer sign -- $_.FullName --app-version $version
              if ($LASTEXITCODE -ne 0) { throw "Could not create updater signature for $($_.Name)." }
            }
          if (-not (Get-ChildItem release/windows -Filter '*.exe.sig' -File)) { throw 'No signed Windows updater artifact was produced.' }
      - name: Upload publishable Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velocity-windows
          path: release/windows/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: velocity-windows
          path: release
      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          if [[ -z "$installer" || ! -f "$installer.sig" ]]; then
            echo "A Windows NSIS installer and its updater signature are required." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          asset_name="$(basename "$installer")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset_name}"
          signature="$(cat "$installer.sig")"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$version" \
            --arg notes "Velocity ${version} is available. See the GitHub release page for full release notes." \
            --arg published_at "$published_at" \
            --arg url "$asset_url" \
            --arg signature "$signature" \
            '{version: $version, notes: $notes, pub_date: $published_at, platforms: {"windows-x86_64": {url: $url, signature: $signature}}}' \
            > release/latest.json
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Velocity ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
